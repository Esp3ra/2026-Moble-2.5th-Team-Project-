<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1490" viewBox="0 0 1440 1490">
<title>Jetson Nano와 Mega 2560 회로 제작용 배선 계획</title>
<desc>MQ-9, DHT11, I2C LCD 2004A, 서보 2개, RGB LED와 부저. 실물 핀 순서가 아닌 신호 연결도.</desc>
<rect width="1440" height="1490" fill="#f3f6fa"/>
<text x="35" y="47" font-family="Noto Sans CJK KR" font-size="32" font-weight="bold" fill="#17324b" text-anchor="start">Jetson Nano + Mega 2560  |  신호·전원 연결도</text>
<text x="35" y="82" font-family="Noto Sans CJK KR" font-size="19" font-weight="normal" fill="#17324b" text-anchor="start">2026-10-14 · 회로 제작 계획 · 실물 핀의 좌우 순서가 아닌, 단자 이름 기준 연결</text>
<rect x="35" y="120" width="340" height="105" rx="12" fill="#ffffff" stroke="#b8c9d8" stroke-width="1.5"/>
<text x="55" y="153" font-family="Noto Sans CJK KR" font-size="23" font-weight="bold" fill="#17324b" text-anchor="start">카메라</text>
<text x="55" y="182" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">Jetson USB에 연결</text>
<text x="55" y="208" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">미승인 인원 검출용</text>
<rect x="530" y="120" width="380" height="105" rx="12" fill="#e4f2ec" stroke="#b8c9d8" stroke-width="1.5"/>
<text x="550" y="153" font-family="Noto Sans CJK KR" font-size="23" font-weight="bold" fill="#17324b" text-anchor="start">Jetson Nano</text>
<text x="550" y="182" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">기존 전원 사용 / GPU 사람 검출</text>
<text x="550" y="208" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">Mega는 USB 데이터 케이블로 연결</text>
<path d="M 375 172 L 530 172" fill="none" stroke="#247f9b" stroke-width="3" />
<text x="452" y="160" font-family="Noto Sans CJK KR" font-size="18" font-weight="bold" fill="#17324b" text-anchor="middle">USB</text>
<path d="M 720 225 L 720 282" fill="none" stroke="#247f9b" stroke-width="3" />
<text x="740" y="260" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">USB A ↔ USB B</text>
<rect x="1000" y="120" width="405" height="105" rx="12" fill="#fff4df" stroke="#b8c9d8" stroke-width="1.5"/>
<text x="1020" y="153" font-family="Noto Sans CJK KR" font-size="23" font-weight="bold" fill="#17324b" text-anchor="start">연결 기준</text>
<text x="1020" y="182" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">청록 실선: 신호 배정</text>
<text x="1020" y="208" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">갈색 점선: 실물·코드 확인 필요</text>
<rect x="530" y="282" width="380" height="680" rx="12" fill="#e3edf7" stroke="#b8c9d8" stroke-width="1.5"/>
<text x="550" y="315" font-family="Noto Sans CJK KR" font-size="23" font-weight="bold" fill="#17324b" text-anchor="start">Arduino Mega 2560</text>
<text x="550" y="355" font-family="Noto Sans CJK KR" font-size="20" font-weight="normal" fill="#17324b" text-anchor="start">5V 로직 · USB 시리얼 115200</text>
<text x="550" y="405" font-family="Noto Sans CJK KR" font-size="22" font-weight="bold" fill="#17324b" text-anchor="start">센서 입력</text>
<text x="550" y="440" font-family="Noto Sans CJK KR" font-size="20" font-weight="normal" fill="#17324b" text-anchor="start">D2  온습도</text>
<text x="550" y="472" font-family="Noto Sans CJK KR" font-size="20" font-weight="normal" fill="#17324b" text-anchor="start">D3  미사용 (IR 제외)</text>
<text x="550" y="504" font-family="Noto Sans CJK KR" font-size="20" font-weight="normal" fill="#17324b" text-anchor="start">A0  가스 ADC</text>
<text x="550" y="536" font-family="Noto Sans CJK KR" font-size="20" font-weight="normal" fill="#17324b" text-anchor="start">D20 / D21  LCD I2C</text>
<text x="550" y="605" font-family="Noto Sans CJK KR" font-size="22" font-weight="bold" fill="#17324b" text-anchor="start">출력</text>
<text x="550" y="640" font-family="Noto Sans CJK KR" font-size="20" font-weight="normal" fill="#17324b" text-anchor="start">D9   환기구 서보</text>
<text x="550" y="672" font-family="Noto Sans CJK KR" font-size="20" font-weight="normal" fill="#17324b" text-anchor="start">D10 연속 회전 서보</text>
<text x="550" y="704" font-family="Noto Sans CJK KR" font-size="20" font-weight="normal" fill="#17324b" text-anchor="start">D28 부저</text>
<text x="550" y="736" font-family="Noto Sans CJK KR" font-size="20" font-weight="normal" fill="#17324b" text-anchor="start">D26 / D22 / D24  RGB</text>
<text x="550" y="810" font-family="Noto Sans CJK KR" font-size="20" font-weight="bold" fill="#17324b" text-anchor="start">D30: 선택 허가 LED</text>
<text x="550" y="842" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">D30 → 330Ω → LED +</text>
<text x="550" y="868" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">LED − → 공통 GND</text>
<text x="550" y="916" font-family="Noto Sans CJK KR" font-size="19" font-weight="bold" fill="#17324b" text-anchor="start">Jetson 40핀 GPIO는 미사용</text>
<rect x="35" y="295" width="405" height="130" rx="12" fill="#ffffff" stroke="#b8c9d8" stroke-width="1.5"/>
<text x="55" y="328" font-family="Noto Sans CJK KR" font-size="23" font-weight="bold" fill="#17324b" text-anchor="start">DHT11</text>
<text x="55" y="357" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">DATA / S → D2</text>
<text x="55" y="383" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">VCC → Mega 5V, GND → 공통 GND</text>
<text x="55" y="409" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">단품: DATA–5V 사이 10kΩ 풀업</text>
<path d="M 440 360 L 530 360" fill="none" stroke="#247f9b" stroke-width="3" />
<text x="485.0" y="350" font-family="Noto Sans CJK KR" font-size="17" font-weight="bold" fill="#17324b" text-anchor="middle">D2</text>
<rect x="35" y="455" width="405" height="130" rx="12" fill="#eef0f3" stroke="#b8c9d8" stroke-width="1.5"/>
<text x="55" y="488" font-family="Noto Sans CJK KR" font-size="23" font-weight="bold" fill="#17324b" text-anchor="start">HW-201  ·  적외선 센서</text>
<text x="55" y="517" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">사용자 요청으로 미사용</text>
<text x="55" y="543" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">배선하지 않음 / D3 입력 비활성</text>
<text x="55" y="569" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">필수 센서 검사에서도 제외</text>
<rect x="35" y="615" width="405" height="150" rx="12" fill="#ffffff" stroke="#b8c9d8" stroke-width="1.5"/>
<text x="55" y="648" font-family="Noto Sans CJK KR" font-size="23" font-weight="bold" fill="#17324b" text-anchor="start">LCD 2004A  ·  I2C 20×4</text>
<text x="55" y="677" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">SDA → D20, SCL → D21</text>
<text x="55" y="703" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">VCC → Mega 5V, GND → 공통 GND</text>
<text x="55" y="729" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">5V / 4핀 백팩 사용자 확인 완료</text>
<text x="55" y="755" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">실측 0x27 / 온습도 글자 표시 확인</text>
<path d="M 440 690 L 530 690" fill="none" stroke="#247f9b" stroke-width="3" />
<text x="485.0" y="680" font-family="Noto Sans CJK KR" font-size="17" font-weight="bold" fill="#17324b" text-anchor="middle">20 / 21</text>
<rect x="35" y="795" width="405" height="167" rx="12" fill="#fff8e9" stroke="#b8c9d8" stroke-width="1.5"/>
<text x="55" y="828" font-family="Noto Sans CJK KR" font-size="23" font-weight="bold" fill="#17324b" text-anchor="start">MQ-9  ·  FLYING FISH 모듈</text>
<text x="55" y="857" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">AO → A0, DO는 미연결</text>
<text x="55" y="883" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">5V 모듈이면 VCC → 외부 5V</text>
<text x="55" y="909" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">GND → 공통 GND / 단자·히터 확인</text>
<text x="55" y="935" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">5V 고정 원시값 시연 ≠ CO ppm 측정</text>
<path d="M 440 880 L 530 880" fill="none" stroke="#ad7720" stroke-width="3" stroke-dasharray="8 5"/>
<text x="485.0" y="870" font-family="Noto Sans CJK KR" font-size="17" font-weight="bold" fill="#17324b" text-anchor="middle">A0</text>
<rect x="1000" y="295" width="405" height="130" rx="12" fill="#ffffff" stroke="#b8c9d8" stroke-width="1.5"/>
<text x="1020" y="328" font-family="Noto Sans CJK KR" font-size="23" font-weight="bold" fill="#17324b" text-anchor="start">일반 SG90  ·  환기구 개폐</text>
<text x="1020" y="357" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">신호 S → D9</text>
<text x="1020" y="383" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">전원 + → 외부 5V, GND → 공통 GND</text>
<text x="1020" y="409" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">작은 각도 이동 확인 / 기구 각도 미보정</text>
<path d="M 910 360 L 1000 360" fill="none" stroke="#247f9b" stroke-width="3" />
<text x="955.0" y="350" font-family="Noto Sans CJK KR" font-size="17" font-weight="bold" fill="#17324b" text-anchor="middle">D9</text>
<rect x="1000" y="455" width="405" height="130" rx="12" fill="#e4f2ec" stroke="#b8c9d8" stroke-width="1.5"/>
<text x="1020" y="488" font-family="Noto Sans CJK KR" font-size="23" font-weight="bold" fill="#17324b" text-anchor="start">SG90 360  ·  시연 장치 회전</text>
<text x="1020" y="517" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">신호 S → D10</text>
<text x="1020" y="543" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">전원 + → 외부 5V, GND → 공통 GND</text>
<text x="1020" y="569" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">1600µs 회전 / 1500µs 정지 확인</text>
<path d="M 910 520 L 1000 520" fill="none" stroke="#247f9b" stroke-width="3" />
<text x="955.0" y="510" font-family="Noto Sans CJK KR" font-size="17" font-weight="bold" fill="#17324b" text-anchor="middle">D10</text>
<rect x="1000" y="615" width="405" height="150" rx="12" fill="#e4f2ec" stroke="#b8c9d8" stroke-width="1.5"/>
<text x="1020" y="648" font-family="Noto Sans CJK KR" font-size="23" font-weight="bold" fill="#17324b" text-anchor="start">MH-FMD  ·  부저 모듈</text>
<text x="1020" y="677" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">S / IN / I/O → D28</text>
<text x="1020" y="703" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">VCC → 5V 전원</text>
<text x="1020" y="729" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">GND → 공통 GND</text>
<text x="1020" y="755" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">2kHz 주파수 구동으로 소리 확인</text>
<path d="M 910 690 L 1000 690" fill="none" stroke="#247f9b" stroke-width="3" />
<text x="955.0" y="680" font-family="Noto Sans CJK KR" font-size="17" font-weight="bold" fill="#17324b" text-anchor="middle">D28</text>
<rect x="1000" y="795" width="405" height="167" rx="12" fill="#e4f2ec" stroke="#b8c9d8" stroke-width="1.5"/>
<text x="1020" y="828" font-family="Noto Sans CJK KR" font-size="23" font-weight="bold" fill="#17324b" text-anchor="start">HW-479  ·  RGB LED</text>
<text x="1020" y="857" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">D26 → R / D22 → G / D24 → B</text>
<text x="1020" y="883" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">모듈 내장 저항 사용 (사용자 확인)</text>
<text x="1020" y="909" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">사용자 확인 공통 음극: − → GND</text>
<text x="1020" y="935" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">빨강·초록·파랑·노랑·꺼짐 시험 통과</text>
<path d="M 910 880 L 1000 880" fill="none" stroke="#247f9b" stroke-width="3" />
<text x="955.0" y="870" font-family="Noto Sans CJK KR" font-size="17" font-weight="bold" fill="#17324b" text-anchor="middle">26/22/24</text>
<text x="35" y="1010" font-family="Noto Sans CJK KR" font-size="26" font-weight="bold" fill="#17324b" text-anchor="start">전원 분리 — +5V 두 선은 합치지 않고, GND만 공통 연결</text>
<rect x="35" y="1035" width="630" height="135" rx="12" fill="#e8f3fb" stroke="#b8c9d8" stroke-width="1.5"/>
<text x="55" y="1068" font-family="Noto Sans CJK KR" font-size="23" font-weight="bold" fill="#17324b" text-anchor="start">Mega 5V  ·  USB에서 공급</text>
<text x="55" y="1097" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">DHT11 + LCD (HW-201 미사용)</text>
<text x="55" y="1123" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">서보는 이 전원에 연결하지 않음</text>
<text x="55" y="1149" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">외부 +5V를 Mega 5V 핀에 병렬 연결하지 않음</text>
<rect x="775" y="1035" width="630" height="135" rx="12" fill="#fff0e8" stroke="#b8c9d8" stroke-width="1.5"/>
<text x="795" y="1068" font-family="Noto Sans CJK KR" font-size="23" font-weight="bold" fill="#17324b" text-anchor="start">서보 시험 전원  ·  외부 5V 2A 확인</text>
<text x="795" y="1097" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">10초 동시 구동: 두 서보 움직임 확인</text>
<text x="795" y="1123" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">서보는 전원 분배 단자에서 각각 분기</text>
<text x="795" y="1149" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">최종 정격은 실제 소비 전류·배선 허용 전류로 선정</text>
<path d="M 665 1100 L 775 1100" fill="none" stroke="#ba4a48" stroke-width="3" stroke-dasharray="8 5"/>
<text x="720" y="1080" font-family="Noto Sans CJK KR" font-size="17" font-weight="bold" fill="#ba4a48" text-anchor="middle">연결 금지</text>
<path d="M 350 1170 L 350 1205" fill="none" stroke="#596a78" stroke-width="3" />
<path d="M 1090 1170 L 1090 1205" fill="none" stroke="#596a78" stroke-width="3" />
<path d="M 350 1205 L 1090 1205" fill="none" stroke="#596a78" stroke-width="3" />
<rect x="35" y="1225" width="1370" height="65" rx="12" fill="#e5eaf0" stroke="#b8c9d8" stroke-width="1.5"/>
<text x="55" y="1258" font-family="Noto Sans CJK KR" font-size="23" font-weight="bold" fill="#17324b" text-anchor="start">공통 GND: Mega GND = 외부 전원 − = 모든 센서·서보 GND</text>
<path d="M 720 1205 L 720 1225" fill="none" stroke="#596a78" stroke-width="3" />
<rect x="35" y="1315" width="1370" height="140" rx="12" fill="#fff4df" stroke="#b8c9d8" stroke-width="1.5"/>
<text x="55" y="1348" font-family="Noto Sans CJK KR" font-size="23" font-weight="bold" fill="#17324b" text-anchor="start">배선 완료 후 코드 조정·부품별 시험</text>
<text x="55" y="1377" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">10초 무부하 동시 시험: 두 서보·LCD·부저 안정성 확인. 실제 기구 부하의 전원 여유는 별도 검증합니다.</text>
<text x="55" y="1403" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">MQ-9 ADC 원시값 수신 확인. 표준 CO 측정은 히터 전압 주기와 보정이 별도로 필요합니다.</text>
<text x="55" y="1429" font-family="Noto Sans CJK KR" font-size="18" font-weight="normal" fill="#17324b" text-anchor="start">단자 위치·극성은 실물 표기를 따르세요. 상세 배선·전원 조건·시험 순서: docs/WIRING.md</text>
</svg>